packages:
  - apps/*
  - packages/*
  - services/*
  - home

# Storybook pulls in esbuild, whose install script only swaps in its binary for speed (the binary itself comes from a platform
# package), so it isn't run: an unanswered build script makes `pnpm install --frozen-lockfile` exit 1, here and on Vercel.
allowBuilds:
  esbuild: false

# One React for core and every guide that ships its own components.
catalog:
  react: ^19.3.1
  react-dom: ^19.3.1
