# The harness's config (docs: harness/docs/design.md in the harness repository).
[project]
name = "hundo"

[tools]
dir = "harness"

[defaults]
# package.json's check script (lint, typecheck, tests, build), the one `pnpm check` runs
check = "bun run check"
rules = "CLAUDE.md"

[hooks]
# trailers = true   # refuse AI co-author / "generated with" trailers
lock     = false    # hundo: every child works in its own worktree on its own branch, so the board is a list of who does what and nothing waits on it
# stamp    = true   # a push wants a passing check on the tree
# review   = true   # a push wants a recorded review

[session]
worktrees = true    # a child gets its own worktree: the child skill passes use_worktree for a desktop child (CLAUDE.md, "Sessions and worktrees")
decisions = "opener"  # a child asks the user nothing: every question and every go (push, merge, any choice) goes to its opener, which asks in its own session

[checks]
queue = true        # one `check` at a time on the machine: parallel worktrees' checks overloaded it (harness/queue.ts)
# queue_limit = 30  # minutes a queued run may take before q stops it (0: none); a job that runs longer passes its own: `queueSelf(name, { limit })`, `q.ts --limit`

[asks]
# the template's asks this project leaves out (harness/templates/settings-asks.json), exact strings: init.ts doesn't merge them and removes them from .claude/settings.json, doctor.ts reports one that is there.
# git push: main is protected server-side, so a push can't change it (CLAUDE.md, Working rules, says what it still reaches). gh pr merge, Vercel and every other ask stay. The user level (a hook in ~/.claude/settings.json, harness/claude-hooks/ask-push.ts) allows a plain push to origin here and asks for a destructive one and for every push elsewhere.
skip = ["Bash(git push *)", "Bash(git -C * push)", "Bash(git -C * push *)"]
