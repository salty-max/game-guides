# The harness's config (docs: harness/docs/design.md in the harness repository).
[project]
name = "hundo"

[tools]
dir = "harness"

[defaults]
# package.json's check script (lint, typecheck, tests, build), the one `pnpm check` runs
check = "bun run check"
rules = "CLAUDE.md"

[hooks]
# trailers = true   # refuse AI co-author / "generated with" trailers
lock     = false    # hundo: every child has its own worktree and branch, so the board is a list, not a lock (CLAUDE.md, "Sessions and worktrees")
# stamp    = true   # a push wants a passing check on the tree
# review   = true   # a push wants a recorded review
