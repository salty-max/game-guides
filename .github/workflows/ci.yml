# Every pull request and every push to main: the same four checks as `pnpm check`,
# run from the root over every package. Vercel builds each app on its own, so this
# is the one place that checks all three guides, and core against each of them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # (pnpm's version comes from packageManager in package.json)
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # (the Vercel projects build on 26.x)
          node-version: 26
          cache: pnpm
      # (fails when pnpm-lock.yaml no longer matches a package.json, as Vercel's install would)
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
